version: '3.8'

# ========================================================
# TaskFlow – Cloud-Based Task Management System
# Multi-container Docker Compose configuration
# Services: Frontend (React+Nginx), Backend (Node+Express), Database (MongoDB)
# ========================================================

services:
  # ------------------------------------------------------
  # Database Service: MongoDB
  # ------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: taskflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskflow-network
    environment:
      - MONGO_INITDB_DATABASE=taskflow
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------
  # Backend API Service: Node.js Express REST API
  # ------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/taskflow
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------
  # Frontend Service: React Production SPA served by Nginx
  # ------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

# ========================================================
# Volumes & Networks
# ========================================================
volumes:
  mongodb_data:
    driver: local

networks:
  taskflow-network:
    driver: bridge
