name: TaskFlow Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ====================================================
  # Job 1: Build & Push Production Docker Images
  # ====================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # Only push if secrets are configured
    if: github.repository == 'aMiT-sInGh-8268/Se_project'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}

  # ====================================================
  # Job 2: Deploy to AWS EC2 via SSH
  # ====================================================
  deploy-to-aws:
    name: Deploy to AWS EC2 (Kubernetes / Docker)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: env.EC2_HOST != ''
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Kubernetes Manifests to AWS EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Connected to AWS EC2 Instance."
            
            # Create project directory if not exists
            mkdir -p ~/taskflow/k8s
            
            # Pull latest git changes or update manifests
            cd ~/taskflow
            
            # Apply Kubernetes configuration (using k3s / kubectl)
            if command -v kubectl &> /dev/null; then
              echo "Applying Kubernetes manifests..."
              kubectl apply -f ~/taskflow/k8s/
              kubectl rollout restart deployment/backend-deployment -n taskflow
              kubectl rollout restart deployment/frontend-deployment -n taskflow
              echo "Deployment rollout completed!"
            elif command -v docker &> /dev/null; then
              echo "Updating Docker containers..."
              docker compose pull || true
              docker compose up -d --remove-orphans
              echo "Docker containers updated!"
            fi
          EOF
