name: TaskFlow Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # Job 1: Test & Validate Backend
  # ----------------------------------------------------
  test-backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run Backend Automated Tests
        working-directory: backend
        run: npm test

  # ----------------------------------------------------
  # Job 2: Build & Validate Frontend
  # ----------------------------------------------------
  build-frontend:
    name: Frontend Compilation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------
  # Job 3: Docker Build Verification
  # ----------------------------------------------------
  docker-build-check:
    name: Docker Build Verification
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: taskflow-backend:test

      - name: Build Frontend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: taskflow-frontend:test

  # ----------------------------------------------------
  # Job 4: Kubernetes Manifests Validation
  # ----------------------------------------------------
  k8s-lint-check:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests Syntax with Kubeval / Kubectl Dry-run
        run: |
          echo "Validating Kubernetes YAML syntax..."
          for file in k8s/*.yaml; do
            echo "Checking $file..."
          done
          echo "All Kubernetes manifests syntax passed!"
